# ============================================
# Autonomous Cognitive Engine (ACE) - Docker Compose
# ============================================

services:
  # ============================================
  # Temporal Development Server & Web UI
  # ============================================
  temporal:
    image: temporalio/auto-setup:latest
    container_name: ace-temporal-server
    ports:
      - "7233:7233"  # Temporal gRPC address
      - "8233:8233"  # Temporal Web UI
    environment:
      - DB=sqlite
      - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/development-sql.yaml
    volumes:
      - temporal_data:/etc/temporal/schema
    restart: unless-stopped

  # ============================================
  # ACE Temporal Worker Service
  # ============================================
  temporal-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ace-temporal-worker
    command: ["uv", "run", "python", "-m", "temporal_integration.worker"]
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_TASK_QUEUE=ace-research
    depends_on:
      - temporal
    volumes:
      - research_reports:/app/src/deep_research_from_scratch/files
    restart: unless-stopped

  # ============================================
  # LangGraph Dev Server (Studio UI support)
  # ============================================
  deep-research:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: deep-research-agent
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - PORT=8000
      - TEMPORAL_ADDRESS=temporal:7233
    volumes:
      - research_reports:/app/src/deep_research_from_scratch/files
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 1G
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/ok"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ============================================
  # Jupyter Notebook Service (Development Only)
  # ============================================
  jupyter:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: deep-research-jupyter
    command: >
      uv run jupyter notebook 
      --ip=0.0.0.0 
      --port=8888 
      --no-browser 
      --allow-root 
      --NotebookApp.token=''
      --NotebookApp.password=''
    ports:
      - "8888:8888"
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./notebooks:/app/notebooks
      - research_reports:/app/src/deep_research_from_scratch/files
    profiles:
      - dev
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 1G

volumes:
  research_reports:
    driver: local
  temporal_data:
    driver: local
